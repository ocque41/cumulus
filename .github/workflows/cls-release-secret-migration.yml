name: migrate CLS release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
      NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}
      CARGO_REGISTRY_TOKEN_VALUE: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_API_TOKEN_VALUE: ${{ secrets.PYPI_API_TOKEN }}
      MIRROR_PUSH_TOKEN_VALUE: ${{ secrets.MIRROR_PUSH_TOKEN }}
    steps:
      - name: Copy release secrets to Cumulus-s/cumulus-create
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${NPM_TOKEN_VALUE:-}"
          test -n "${CARGO_REGISTRY_TOKEN_VALUE:-}"
          test -n "${PYPI_API_TOKEN_VALUE:-}"
          test -n "${MIRROR_PUSH_TOKEN_VALUE:-}"
          gh secret set NPM_TOKEN -R Cumulus-s/cumulus-create --body "$NPM_TOKEN_VALUE"
          gh secret set CARGO_REGISTRY_TOKEN -R Cumulus-s/cumulus-create --body "$CARGO_REGISTRY_TOKEN_VALUE"
          gh secret set PYPI_API_TOKEN -R Cumulus-s/cumulus-create --body "$PYPI_API_TOKEN_VALUE"
          gh secret set MIRROR_PUSH_TOKEN -R Cumulus-s/cumulus-create --body "$MIRROR_PUSH_TOKEN_VALUE"
