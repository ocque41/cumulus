name: Cumulus release checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium for public browser checks
        run: npx playwright install --with-deps chromium

      - name: Run the complete public release checks
        run: npm run verify

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e
